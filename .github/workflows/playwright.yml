name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Create .env file
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL || 'https://www.saucedemo.com' }}" >> .env
          echo "VALID_USERNAME=${{ secrets.VALID_USERNAME || 'standard_user' }}" >> .env
          echo "VALID_PASSWORD=${{ secrets.VALID_PASSWORD || 'secret_sauce' }}" >> .env
          echo "LOCKED_USERNAME=${{ secrets.LOCKED_USERNAME || 'locked_out_user' }}" >> .env
          echo "API_BASE_URL=${{ secrets.API_BASE_URL || 'https://reqres.in/api' }}" >> .env

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces & screenshots)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
